<!DOCTYPE html>
<html lang="tr">
<head>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#120a1e"><link rel="apple-touch-icon" href="img/icon192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Mythbeast Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Başlık yazı tipi: Fira Sans Black (SIL OFL 1.1, font/OFL.txt) — Türkçe harflerin tamamı var */
@font-face{font-family:'MRDisplay';src:url(font/FiraSans-Black.woff) format('woff');font-weight:100 900;font-style:normal;font-display:swap}

/* VOICE: oyun; paket açarken heyecan, kurallarda net
   IDEA: basılı koleksiyon kartı — üstte can, ortada pencere resim, altta saldırılar ve zayıflık satırı
   PICTURE: 2.5D kartlar; poşet yırtılır, kartlar desteden tek tek çevrilir
   COLOUR and TYPE: gece zemini, element renkli kart gövdeleri, nadirlik metalleri; Lilita One + Rubik
   LAYOUT: dikey telefon, üst bar, içerik, dört sekmeli alt çubuk */
:root{color-scheme:dark;--bg:#0d1214;--panel:#172024;--line:#26343a;--ink:#eef3f1;--mute:#93a6a9;--acc:#ff5a4e;--gold:#f5c451;--dust:#9fd8ff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body.inb nav{display:none}body.inb main{padding-bottom:24px}
body{background:linear-gradient(#0b121acc,#0b121a99 30%,#0b121add 75%),url(img/menubg.jpg) center top/cover fixed,var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{font:20px/.95 'MRDisplay',sans-serif;flex:1;display:flex;flex-direction:column;color:#ffd25a;text-shadow:0 2px 0 #4a2310}.logo small{font-size:12.5px;color:#f3e3c0;letter-spacing:.5px}
.res{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 6px;font-weight:700;font-size:14px;white-space:nowrap}
.pill i{width:16px;height:16px;border-radius:50%;display:block}
.pill .g{background:radial-gradient(circle at 35% 30%,#fff3b8,var(--gold) 45%,#a26d10)}
.pill .d{background:radial-gradient(circle at 35% 30%,#fff,var(--dust) 45%,#2c6c99);border-radius:3px;transform:rotate(45deg) scale(.8)}
.prog{padding:0 14px 6px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.prog .bar{flex:1;height:8px;background:var(--panel);border-radius:9px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .6s}
main{flex:1;padding:6px 14px 100px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:6;background:linear-gradient(transparent,var(--bg) 35%);padding:16px 10px max(10px,env(safe-area-inset-bottom))}
nav div{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:5px;width:100%;max-width:460px}
nav button{flex:1;min-height:50px;border:0;border-radius:13px;background:transparent;color:var(--mute);font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{background:#22302f;color:var(--ink)}
h2{font:28px/1.1 'MRDisplay',sans-serif;margin:8px 0 4px}
h3{font:20px/1.2 'MRDisplay',sans-serif;margin:22px 0 8px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.btn{min-height:50px;border:0;border-radius:14px;padding:0 18px;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(#ff7363,var(--acc));box-shadow:0 4px 0 #a8302a;width:100%;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8302a}
.btn:disabled{filter:grayscale(1) brightness(.55);box-shadow:none}
.btn.alt{background:#24353a;box-shadow:0 4px 0 #111b1e}
.btn:focus-visible,nav button:focus-visible,.atkb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ================= KART ================= */
.card{--w:120px;width:var(--w);aspect-ratio:5/7;font-size:33px;position:relative;--rx:0deg;--ry:0deg;--mx:50%;--my:30%}
/* kart her zaman 330px genişlikte dizilir ve küçültülür: telefonların en küçük yazı boyutu sınırı düzeni bozmasın */
.cs{position:absolute;left:0;top:0;width:330px;transform-origin:0 0;transform:scale(var(--k,.36));perspective:1060px;transform-style:preserve-3d}
.tilt{width:100%;aspect-ratio:5/7;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .2s ease-out;position:relative}
.frame{position:absolute;inset:0;border-radius:.55em;border:.26em solid transparent;background:linear-gradient(170deg,var(--bd1),var(--bd2)) padding-box,var(--rb) border-box;box-shadow:0 .5em 1.1em #000a;display:flex;flex-direction:column;padding:.2em .3em .18em;color:#1d1a16;transform-style:preserve-3d}
.t-fire{--bd1:#fbdcc6;--bd2:#ee9f75;--ec:#ff6a3d}
.t-water{--bd1:#d6ecfa;--bd2:#86bfe9;--ec:#2f9be6}
.t-earth{--bd1:#e2eec6;--bd2:#a6c672;--ec:#6f9e2e}
.t-air{--bd1:#f4f6fa;--bd2:#bfcbe0;--ec:#7e93b8}
.t-light{--bd1:#fffbe6;--bd2:#f2d58a;--ec:#e8b520}
.t-shadow{--bd1:#e4dcf2;--bd2:#9b86c4;--ec:#6d4aa8}
.r0{--rb:linear-gradient(140deg,#e2e6e8,#7d878d,#e2e6e8);--rc:#8d979c}
.r1{--rb:linear-gradient(140deg,#d6ebff,#2f7fd6,#d6ebff);--rc:#2f7fd6}
.r2{--rb:linear-gradient(140deg,#f3ddff,#8b3fe0,#ffd6f5,#8b3fe0);--rc:#9a4fe8}
.r3{--rb:linear-gradient(140deg,#fff6c2,#d99a12,#fff2a8,#b8780a);--rc:#d99a12}
.hd{display:flex;align-items:flex-end;gap:.18em;height:1.28em;flex:none;transform:translateZ(.7em)}
.hd .l{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.stg{font-size:.32em;font-weight:700;line-height:1;background:#0000001f;padding:.2em .5em;border-radius:1em;margin-bottom:.25em;white-space:nowrap}
.nm{font:.8em/1.05 'MRDisplay',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hpv{font:.82em/1 'MRDisplay',sans-serif;color:#c0281c;white-space:nowrap}
.hpv small{font-size:.42em;font-weight:700;color:#1d1a16;margin-right:.15em;font-family:Rubik,sans-serif}
.ti{width:1.05em;height:1.05em;border-radius:50%;flex:none;background:var(--ec);display:grid;place-items:center;box-shadow:inset 0 -.08em 0 #0004,0 0 0 .05em #0005}
.ti svg,.en svg{width:66%;height:66%;filter:brightness(0) invert(1)}
.sp{height:5.25em;flex:none;margin-top:.12em}
.art{position:absolute;left:.3em;right:.3em;top:1.58em;height:5.25em;border-radius:.18em;overflow:hidden;border:.12em solid;border-color:#ffffffb0 #0005 #0005 #ffffffb0;transform:translateZ(1.3em) scale(.97);box-shadow:0 .25em .5em #0006}
.art svg,.aimg{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.r3 .aimg{object-position:50% 20%}.ma .aimg,.ta .aimg{object-position:50% 40%}
.inf{font-size:.3em;font-style:italic;line-height:1.2;text-align:center;margin:.9em 0 .3em;padding:.25em 0;background:linear-gradient(90deg,transparent,#ffffff8c,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateZ(.5em);flex:none}
.atks{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.22em;transform:translateZ(.6em)}
.ak{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:.25em}
.cost{display:flex;gap:.07em}
.en{width:.6em;height:.6em;border-radius:50%;background:var(--ec);display:grid;place-items:center;box-shadow:inset 0 -.06em 0 #0005,0 0 0 .04em #0006;flex:none}
.akn{font-size:.5em;font-weight:700;line-height:1.1}
.akd{font:.72em/1 'MRDisplay',sans-serif}
.akt{grid-column:1/-1;font-size:.31em;line-height:1.25;opacity:.85;margin-top:.1em}
.ftr{flex:none;transform:translateZ(.4em)}
.wr{display:flex;justify-content:space-between;align-items:center;font-size:.29em;font-weight:700;border-top:.12em solid #00000030;padding-top:.4em}
.wr span{display:flex;align-items:center;gap:.3em;white-space:nowrap}
.wr .en{width:1.7em;height:1.7em}
.wr .rt{display:inline-block;width:1.2em;height:1.2em;border-radius:50%;background:#fff;box-shadow:0 0 0 .12em #0005}
.flv{font-size:.28em;font-style:italic;line-height:1.3;margin:.5em 0 .3em;opacity:.8;height:2.6em;overflow:hidden}
.set{display:flex;justify-content:space-between;font-size:.28em;font-weight:700;opacity:.8}
.sym{color:var(--rc);font-size:1.4em;line-height:.8}
.r3 .art{inset:0;height:auto;border:0;border-radius:.3em;transform:translateZ(.15em)}
.r3 .hd,.r3 .inf,.r3 .atks,.r3 .ftr{background:#ffffffd0;border-radius:.3em}
.r3 .hd{padding:0 .2em .1em}.r3 .atks{padding:.15em .25em;flex:0 0 auto;margin-top:.2em}.r3 .ftr{padding:.1em .25em;margin-top:auto}
.r3 .inf{background:#ffffffd0}
.shine{position:absolute;inset:0;border-radius:.3em;pointer-events:none;background:radial-gradient(circle at var(--mx) var(--my),#ffffff66,transparent 50%);mix-blend-mode:overlay;transform:translateZ(1.5em)}
.r2 .art::after,.r3 .art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,#ff6bd5 32%,#6bf3ff 44%,#fffb6b 56%,#7dff8a 68%,transparent 80%);background-size:260% 260%;background-position:var(--mx) var(--my);mix-blend-mode:color-dodge;opacity:.2;pointer-events:none}
.new{position:absolute;top:-.55em;left:50%;translate:-50% 0;background:var(--gold);color:#3a2600;font-size:.5em;font-weight:700;padding:.3em .7em;border-radius:99px;transform:translateZ(2em);white-space:nowrap;line-height:1}
.card.miss .frame{background:linear-gradient(#1b2226,#12181b) padding-box,linear-gradient(#2c373c,#2c373c) border-box;color:#6b7c83}
.card.miss .art .aimg{filter:grayscale(1) brightness(.3) contrast(1.3)}
.card.miss .art svg{filter:grayscale(1) brightness(.35) contrast(1.4)}
.card.miss .art::after{display:none}
.card.miss .hpv{color:#6b7c83}.card.miss .en,.card.miss .ti{background:#2c373c}
.card.miss .r3 .hd,.card.miss.r3 .hd,.card.miss.r3 .inf,.card.miss.r3 .atks,.card.miss.r3 .ftr{background:#12181bd0}
.card.big{animation:floaty 4s ease-in-out infinite;touch-action:none}
@keyframes floaty{50%{translate:0 -7px}}

/* ================= PAKET EKRANI ================= */
.packzone{display:grid;place-items:center;padding:6px 0 16px}
.netbar{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);z-index:9999;background:#7a1d1d;color:#fff;border:1px solid #ff8a8a;border-radius:12px;padding:8px 14px;font-weight:700;font-size:13px;box-shadow:0 6px 18px #0008;animation:nbpulse 1.4s ease-in-out infinite}
@keyframes nbpulse{50%{opacity:.75}}
/* Safari/iPhone: ağır filtreler bellek ve GPU yükü bindirir; sade görünüm */
.lowfx *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.lowfx .pk,.lowfx .tear{filter:none!important}
.lowfx .card.holo .cs{filter:none!important;animation:none!important}
.pk{width:min(56vw,220px);aspect-ratio:620/911;filter:drop-shadow(0 16px 24px #000a);position:relative;cursor:pointer;animation:floaty 3.4s ease-in-out infinite}
.foil{position:absolute;inset:0;border-radius:12px;background:linear-gradient(160deg,#ff9a5c,#d8344a 40%,#6a1d7e 75%,#2a1450);box-shadow:0 18px 40px #000a,inset 0 0 0 3px #ffffff30;overflow:hidden}
.foil::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff40 45%,transparent 60%);background-size:250% 100%;animation:gl 3s linear infinite}
@keyframes gl{from{background-position:120% 0}to{background-position:-120% 0}}
.foil .zz{position:absolute;left:0;right:0;top:14%;height:6px;background:repeating-linear-gradient(90deg,#ffffff70 0 6px,transparent 6px 11px)}
.foil .tt{position:absolute;left:0;right:0;top:20%;text-align:center;font:clamp(22px,7vw,30px)/1 'MRDisplay',sans-serif;text-shadow:0 3px 0 #0007}
.foil .ring{position:absolute;left:50%;top:38%;translate:-50% 0;width:58%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid #fff8;box-shadow:0 0 30px #ffd56a88}
.foil .ring svg{width:100%;height:100%}
.foil .ss{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:12px;font-weight:700}
.fp{border:22px solid transparent;border-image:url(img/panel.webp) 95 fill / 22px / 4px stretch;padding:0 4px;margin-top:10px;background:none}
.pity{display:flex;align-items:center;gap:10px;font-size:14px}
.pmed{width:52px;height:52px;flex:none;filter:drop-shadow(0 0 8px #ff9a2a66)}
.pti{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}.pti b{font:17px/1.1 'MRDisplay',sans-serif;color:var(--gold)}.pti small{color:#c9d3dc;font-size:12.5px}.pti em{font-style:normal;color:#ffd36a;font-weight:700}
.pity .bar{height:12px;background:#050a18;border-radius:9px;overflow:hidden;margin-top:6px;box-shadow:inset 0 1px 3px #000,0 0 0 1px #c9972f88}
.pity .bar i{display:block;height:100%;background:linear-gradient(#fff6c0,#ffcf4a 45%,#d48a12);box-shadow:0 0 8px #ffc84a;position:relative;border-radius:9px}
.pity.hot .pmed{animation:chg 1s ease-in-out infinite;filter:drop-shadow(0 0 14px #ff9a2a)}.pity.hot .bar i{animation:bglow 1s ease-in-out infinite}
@keyframes bglow{50%{filter:brightness(1.35)}}
.gift{display:flex;align-items:center;gap:10px}.gfi{width:50px;height:50px;flex:none;filter:grayscale(.5) brightness(.75)}.gift.rdy .gfi{filter:drop-shadow(0 0 8px #ffc84a99);animation:chg 1.4s ease-in-out infinite}
.gft{flex:1;display:flex;flex-direction:column;min-width:0}.gft b{font:17px/1.15 'MRDisplay',sans-serif}.gift.rdy .gft b{color:var(--gold)}.gft small{color:#c9d3dc;font-size:12.5px}
.gbtn{flex:none;border:0;border-radius:12px;padding:8px 18px;background:linear-gradient(#7dffa0,#2fbf5a);color:#06300f;font:18px 'MRDisplay',sans-serif;box-shadow:0 3px 0 #1a7a36}
.rares .rh{display:block;font:16px 'MRDisplay',sans-serif;color:#dfe8f0;margin-bottom:6px}.rem{color:#aab6c2;font-size:12.5px}
.rrow{display:flex;gap:8px}.rit{flex:0 0 calc((100% - 16px)/3);min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;cursor:pointer}
.rit img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:2px solid #b07bff}.rit.r3 img{border-color:var(--gold);box-shadow:0 0 10px #ffc84a88}
.rit span{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.rit small{font-size:10.5px;color:#aab6c2}
nav button.dot{position:relative}nav button.dot::after{content:'';position:absolute;top:6px;right:22%;width:10px;height:10px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 0 2px #0d1418}
.free{font-size:14px;color:var(--gold);text-align:center;margin:8px 0 0;font-weight:700}

/* ================= AÇILIŞ ================= */
.ov{position:fixed;inset:0;z-index:20;background:radial-gradient(80% 60% at 50% 45%,#2b1c33f2,#07090af7);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px;overflow:hidden}
.ov.on{display:flex}
.ovt{font:24px/1.15 'MRDisplay',sans-serif;text-align:center;min-height:1.2em}
.hint{color:var(--mute);font-size:14px;margin:0;text-align:center;min-height:1.5em}
.ovb{display:flex;gap:10px;width:100%;max-width:340px}
.tear{position:relative;width:min(68vw,270px);aspect-ratio:620/911;filter:drop-shadow(0 16px 24px #000a);touch-action:none;cursor:grab}
.tear .cap,.tear .pb{position:absolute;left:0;right:0;overflow:hidden}
.tear .cap{top:0;height:14%;border-radius:12px 12px 0 0;transition:transform .7s cubic-bezier(.2,.8,.3,1),opacity .7s;z-index:2}
.tear .pb{top:14%;bottom:0;border-radius:0 0 12px 12px;transition:transform .8s .25s ease-in}
.tear .cap .foil{bottom:auto;height:714%;border-radius:0}
.tear .pb .foil{top:-16.3%;height:116.3%;border-radius:0}
.tear .cap.off{transform:translate(70px,-160px) rotate(-28deg);opacity:0}
.tear .pb.down{transform:translateY(80vh)}
.cut{position:absolute;top:14%;left:0;height:4px;width:0;background:#fff;box-shadow:0 0 10px 2px #fff;z-index:3;border-radius:2px}
.swipe{position:absolute;top:calc(14% - 26px);left:8%;width:30px;height:30px;border-radius:50%;background:#fff;opacity:.85;z-index:4;animation:sw 1.6s ease-in-out infinite;pointer-events:none;box-shadow:0 0 0 6px #ffffff40}
@keyframes sw{0%{left:6%;opacity:0}15%{opacity:.9}80%{left:80%;opacity:.9}100%{left:84%;opacity:0}}
.linkbtn{background:none;border:0;color:var(--mute);font-size:14px;text-decoration:underline;min-height:44px;cursor:pointer}
.stack{position:relative;width:min(76vw,320px);aspect-ratio:5/7;touch-action:none}
.sc{position:absolute;inset:0;transform:translateY(calc(var(--o)*-5px)) scale(calc(1 - var(--o)*.02));transition:transform .45s cubic-bezier(.3,.9,.4,1),opacity .45s}
.stack.rise .sc{animation:rise .6s backwards;animation-delay:calc(var(--o)*70ms)}
@keyframes rise{from{transform:translateY(70vh) scale(.8)}}
.sc.drag{transition:none}
.sc.gl{transform:translateX(-140vw) rotate(-30deg)!important}
.sc.gr{transform:translateX(140vw) rotate(30deg)!important}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.flip.on{transform:rotateY(180deg)}
.flip.slow{transition-duration:1.4s}
.back,.front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{transform:rotateY(180deg)}
.back{border-radius:12px;background:radial-gradient(circle at 50% 50%,#ff5a4e 0 14%,#fff 14% 17%,transparent 17%),repeating-linear-gradient(45deg,#2a1f3a 0 12px,#33264a 12px 24px);border:6px solid #4a3a66;box-shadow:0 10px 30px #000a}
.back.hot{animation:hot .7s ease-in-out infinite}
.back.hot.r2{--hc:#b46cff}.back.hot.r3{--hc:#ffc23d}
@keyframes hot{0%,100%{box-shadow:0 0 18px 4px var(--hc)}50%{box-shadow:0 0 44px 14px var(--hc)}}
.stack.shake{animation:shake .5s}
@keyframes shake{20%{rotate:-4deg}40%{rotate:4deg}60%{rotate:-3deg}80%{rotate:2deg}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#fff6c8,#ffc23d00 70%);pointer-events:none;z-index:30;animation:flash .9s forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.sum{display:grid;grid-template-columns:repeat(3,auto);gap:22px 12px;justify-content:center}
.sum .dl{text-align:center;font-size:12px;color:var(--dust);font-weight:700;margin-top:6px}

/* ================= KOLEKSİYON ================= */
.filters{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;margin:0 -14px}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px;padding-top:8px}
.grid .card{--w:calc((min(100vw,480px) - 52px)/3);cursor:pointer;justify-self:center}
.detail{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:340px;max-height:100%;overflow:auto;padding:8px 0}
.info{width:100%;background:#0d1214cc;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
.info p{margin:2px 0;display:flex;justify-content:space-between;gap:10px}
.info span{color:var(--mute)}

/* ================= ARENA ================= */
.budget{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:10px}
.budget b{font:22px/1 'MRDisplay',sans-serif}
.budget b.over{color:var(--acc)}
.pick .card{cursor:pointer}
.pick .card.sel .fbox{outline:8px solid var(--gold);outline-offset:6px;border-radius:16px}
.pick .card.sel .frame{outline:.25em solid var(--gold);outline-offset:.2em}
.ord{position:absolute;top:-8px;right:-6px;background:var(--gold);color:#3a2600;font:700 11px/1 Rubik,sans-serif;padding:.35em .6em;border-radius:99px;z-index:3;white-space:nowrap}
.cst{position:absolute;bottom:-9px;left:50%;translate:-50% 0;background:#0d1214;border:1px solid var(--line);color:var(--ink);font-size:11px;font-weight:700;padding:.25em .6em;border-radius:99px;z-index:3;white-space:nowrap}
.sticky{position:sticky;bottom:88px;padding-top:14px;z-index:4}
.bt{display:flex;flex-direction:column;gap:10px}
.bench{display:flex;gap:8px;justify-content:center}
.bt-tile{width:112px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;position:relative;transition:transform .2s}
.bt-tile .ta{height:52px;border-radius:8px;overflow:hidden}
.bt-tile .ta svg{width:100%;height:100%}
.bt-tile .tn{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.bt-tile.dead{opacity:.3;filter:grayscale(1)}
.bt-tile.pickable{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);cursor:pointer;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.mini{display:flex;gap:10px;background:linear-gradient(170deg,var(--bd1),var(--bd2));color:#1d1a16;border-radius:16px;padding:8px;position:relative;box-shadow:0 8px 20px #0008;border:3px solid transparent;transition:transform .25s;cursor:pointer}
.mini .ma{width:82px;height:82px;flex:none;border-radius:10px;overflow:hidden;border:2px solid #fff9}
.mini .ma svg{width:100%;height:100%}
.mini .mi{flex:1;display:flex;flex-direction:column;justify-content:center;gap:5px}
.mini .mt{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mini .mt b{font:19px/1.05 'MRDisplay',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt span{font:18px/1 'MRDisplay',sans-serif;color:#c0281c;white-space:nowrap}
.hpb{height:9px;background:#0005;border-radius:9px;overflow:hidden}
.hpb i{display:block;height:100%;background:#35a52c;transition:width .45s}
.hpb i.lo{background:#e2a21b}.hpb i.cr{background:#e2372b}
.meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px;font-weight:700}
.meta .en{width:18px;height:18px}
.burn{background:#c0281c;color:#fff;padding:1px 7px;border-radius:99px;font-size:11px}
.side-tag{font-size:12px;color:var(--mute);text-align:center;margin:-4px 0}
.mini.hit{animation:hit .4s}
@keyframes hit{25%{translate:-9px 0}50%{translate:9px 0}75%{translate:-4px 0}}
.mini.lu{transform:translateY(-22px)}.mini.ld{transform:translateY(22px)}
.mini.pickable{border-color:var(--gold)}
.dmg{position:absolute;top:20%;left:50%;translate:-50% 0;font:34px/1 'MRDisplay',sans-serif;color:#fff;text-shadow:0 2px 0 #b3261e,0 0 8px #000;animation:up 1.1s forwards;pointer-events:none;z-index:3;white-space:nowrap}
.dmg.x{color:var(--gold)}.dmg.w{color:#cfd8da}.dmg.h{color:#7dff8a;text-shadow:0 2px 0 #1d4d17}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.log{min-height:44px;text-align:center;font-weight:700;display:grid;place-items:center;color:var(--gold);font-size:14px;padding:2px 6px;line-height:1.35}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.atkb{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;min-height:54px;border:0;border-radius:14px;padding:6px 14px;background:linear-gradient(170deg,var(--bd1),var(--bd2));color:#1d1a16;text-align:left;box-shadow:0 4px 0 #0007;cursor:pointer}
.atkb:disabled{filter:grayscale(.9) brightness(.5);box-shadow:none}
.atkb .cost{gap:3px}.atkb .en{width:20px;height:20px}
.atkb b{font-size:16px;display:block;line-height:1.15}
.atkb small{font-size:12px;opacity:.8;display:block;line-height:1.2}
.atkb .dv{font:24px/1 'MRDisplay',sans-serif;white-space:nowrap}
.atkb .dv em{font:700 12px Rubik,sans-serif;color:#c0281c;font-style:normal;display:block;text-align:right}
.row2{display:flex;gap:8px}
.row2 .btn{font-size:15px;min-height:46px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}

/* ================= KURALLAR ================= */
.box{border:22px solid transparent;border-image:url(img/panel.webp) 95 fill / 22px / 4px stretch;padding:0 4px;font-size:14px;line-height:1.5}
.box p{margin:6px 0}
.box code{font-family:inherit;background:#0d1214;padding:1px 6px;border-radius:6px;color:var(--gold);font-weight:700}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500}
.sim b{font:22px/1 'MRDisplay',sans-serif;color:var(--gold)}
.simg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.simg div{background:#0d1214;border-radius:10px;padding:10px}
.simg span{display:block;color:var(--mute);font-size:12px}
.toast{position:fixed;left:50%;bottom:100px;translate:-50% 0;background:var(--ink);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:99px;z-index:40;animation:tst 2.2s forwards;white-space:nowrap;font-size:14px}.toast.long{white-space:normal;width:max-content;max-width:min(88vw,380px);border-radius:16px;text-align:center;line-height:1.35;animation-duration:4s}
@keyframes tst{0%{opacity:0;transform:translateY(10px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}

/* ================= SAHNE (video referansı) ================= */
.pill .lvp{background:#3b7be0;color:#fff;font:700 11px/16px Rubik,sans-serif;text-align:center;font-style:normal;width:auto!important;padding:0 5px;border-radius:5px!important}
.ov.scene{background:linear-gradient(#0a0612e0 0 13%,#e6b45a66 13% 13.3%,transparent 13.3%),url(img/packbg.jpg) center 60%/cover,#1a0f24;justify-content:flex-start;padding-top:max(16px,env(safe-area-inset-top))}
.shelf{position:absolute;left:0;right:0;top:3%;height:9%;display:flex;justify-content:center;align-items:flex-end;gap:2.5%;padding:0 6%}
.sh{width:13%;aspect-ratio:1}.sh .abg{display:none}.sh svg{filter:drop-shadow(0 4px 3px #0007);transform:scale(1.7) translateY(-6%)}
.sh svg{width:100%;height:100%}
.sh:has(.aimg){border-radius:8px;overflow:hidden;box-shadow:0 4px 6px #0007}.sh.miss .aimg{filter:brightness(.15)}
.sh.miss svg{filter:brightness(0) drop-shadow(0 4px 3px #0007)}
.hud{position:absolute;left:12px;top:calc(13% + 10px);display:flex;align-items:center;gap:0;z-index:3}
.lvb{width:30px;height:30px;border-radius:8px;background:linear-gradient(#6fb2ff,#2b6fd6);color:#fff;font:700 15px/30px Rubik,sans-serif;text-align:center;font-style:normal;box-shadow:0 2px 0 #1a3f80;z-index:1}
.lvb.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.5)}}
.xpb{width:120px;height:20px;background:#1a1a1ad0;border-radius:0 10px 10px 0;margin-left:-4px;position:relative;overflow:hidden}
.xpb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#7ed0ff,#3a8fe8);transition:width .25s}
.xpb span{position:relative;display:block;text-align:center;font:700 12px/20px Rubik,sans-serif;color:#fff;text-shadow:0 1px 2px #000}
.gem{position:fixed;left:0;top:0;width:16px;height:16px;z-index:50;pointer-events:none;background:linear-gradient(135deg,#d6f1ff,#4aa8ff 50%,#1f5fc0);clip-path:polygon(50% 0,100% 30%,100% 70%,50% 100%,0 70%,0 30%);filter:drop-shadow(0 0 4px #7fd0ff)}
.stage{position:absolute;inset:18% 0 0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 16px}
.chance{background:#1d1d1dd8;color:#fff;font-weight:700;font-size:14px;padding:6px 14px;border-radius:8px;border-left:4px solid var(--gold)}
.cue{font:22px/1.2 'MRDisplay',sans-serif;color:#fff;text-shadow:0 2px 0 #0008,0 0 10px #0006;margin:4px 0 0;text-align:center;min-height:1.2em}
.scene .linkbtn{color:#f1dcc6}
.tab{position:absolute;right:10%;top:22%;width:22%;height:46%;background:linear-gradient(#bfe4ff,#5aa7e8);border-radius:4px;box-shadow:0 2px 4px #0006}
.tab::after{content:"";position:absolute;left:12%;top:30%;width:16%;aspect-ratio:1;border-radius:50%;background:#fff}
.beam{position:absolute;left:10%;right:10%;bottom:86%;height:0;background:linear-gradient(to top,#fff3c4,#ffe39a80 40%,transparent);filter:blur(4px);transition:height .5s;z-index:1;clip-path:polygon(15% 100%,85% 100%,100% 0,0 0)}
.tear.lit .beam{height:120%}
.tear{transition:transform .6s cubic-bezier(.5,0,.7,1),opacity .6s}
.tear.drop{transform:translate(-40vw,55vh) rotate(-25deg) scale(.55);opacity:0}
.rslot{width:min(74vw,310px);aspect-ratio:5/7;position:relative}
.rc{position:absolute;inset:0;perspective:900px}
.rc.deal{animation:dealin .55s cubic-bezier(.2,.9,.3,1.1)}
@keyframes dealin{from{transform:translateY(60vh) rotate(-8deg) scale(.6)}}
.rc .flip{transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.back.sw{border-radius:12px;border:7px solid #133c8f;background:radial-gradient(circle,#fff 0 4%,#bfe6ff 7%,transparent 30%),repeating-conic-gradient(from 10deg,#1f5fd0 0 18deg,#58b4ff 18deg 36deg);box-shadow:0 10px 30px #000a;overflow:hidden}
.back.sw::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 25%,#fff 0 1.5%,transparent 2%),radial-gradient(circle at 78% 70%,#fff 0 1.2%,transparent 1.7%),radial-gradient(circle at 70% 18%,#fff 0 1%,transparent 1.5%);}
.rays{position:absolute;inset:-60%;border-radius:50%;opacity:0;pointer-events:none;background:repeating-conic-gradient(var(--rcol) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%);transition:opacity .4s}
.rays.r1{--rcol:#9fd0ff80}.rays.r2{--rcol:#d6a8ff}.rays.r3{--rcol:#ffe08a}
.rc.charge .rays,.rc.done .rays{opacity:1;animation:spin 6s linear infinite}
.rc.done .rays{opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.rc.charge .flip{animation:wob 1.8s ease-in-out forwards}
.rc.charge.leg .flip{animation:wob 2.6s ease-in-out forwards}
@keyframes wob{0%{transform:none}15%{transform:rotateY(-22deg) scale(1.03)}30%{transform:rotateY(24deg) scale(1.06)}45%{transform:rotateY(-28deg) scale(1.08)}60%{transform:rotateY(30deg) scale(1.1)}75%{transform:rotateY(-34deg) scale(1.12)}100%{transform:rotateY(0) scale(1.15)}}
.rc.charge .back{animation:whiten 1.8s forwards}
.rc.charge.leg .back{animation:whiten 2.6s forwards}
@keyframes whiten{0%{filter:none}40%{filter:brightness(1.6) saturate(.6);box-shadow:0 0 30px 8px #fff8}100%{filter:brightness(4) saturate(0);box-shadow:0 0 80px 30px #fff}}
.rc.charge.leg{animation:shake .5s 4}
.flash.big{background:radial-gradient(circle,#fff 0 30%,var(--fc) 55%,transparent 80%);animation:flash 1.1s forwards}
.banner{font:34px/1 'MRDisplay',sans-serif;color:#fff;text-shadow:0 3px 0 #0009,0 0 14px var(--bc,#fff);-webkit-text-stroke:1px #0005;text-align:center;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;opacity:0}
.banner small{font-size:20px}
.banner.show{animation:bpop .45s cubic-bezier(.3,1.6,.5,1) forwards;color:var(--bc)}
@keyframes bpop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.burst{position:absolute;top:-7%;right:-9%;width:30%;aspect-ratio:1;display:grid;place-items:center;animation:burst .5s cubic-bezier(.3,1.8,.5,1);z-index:5;transform:rotate(12deg)}
.burst svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 4px #0007)}
.burst b{position:relative;font:clamp(15px,4.6vw,20px)/1 'MRDisplay',sans-serif;color:#fff;text-shadow:0 2px 0 #b35a00}
@keyframes burst{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(12deg)}}
.dl2{color:var(--dust);font-weight:700;min-height:22px;text-shadow:0 1px 2px #000}
.cnt2{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));color:#f1dcc6;font-weight:700;font-size:14px}
.spk{position:fixed;left:0;top:0;width:7px;height:7px;z-index:45;pointer-events:none;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@media (max-height:700px){.shelf{display:none}.hud{top:10px}.stage{inset:46px 0 0}}
.foil.img{background:none;box-shadow:none;border-radius:0;}.foil.img::after{display:none}
.foil.img>img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.ptl{position:absolute;left:0;right:0;bottom:7%;text-align:center;font:clamp(20px,6.4vw,28px)/1 'MRDisplay',sans-serif;color:#fff;text-shadow:0 3px 0 #6a1d7e,0 0 12px #0008;-webkit-text-stroke:1px #4a1460}
.ptl small{display:block;font:700 11px/1.6 Rubik,sans-serif;-webkit-text-stroke:0;text-shadow:0 1px 3px #000}
.tear .cap,.tear .pb{border-radius:0!important}
.back,.back.sw{background:url(img/back.webp) center/100% 100% no-repeat!important;border:0!important;border-radius:4%!important;box-shadow:none;filter:drop-shadow(0 10px 18px #000a)}
.back.sw::after,.back::after{display:none}
.back.s2,.back.sw.s2{background:url(img/back2.webp) center/100% 100% no-repeat!important}

/* ================= AI ÇERÇEVELİ KART ================= */
.card.r3 .frame{border-color:transparent;background:linear-gradient(170deg,var(--bd1),var(--bd2)) padding-box;padding:.62em .6em .55em}
.lgb{position:absolute;inset:-.26em;width:calc(100% + .52em);height:calc(100% + .52em);transform:translateZ(1.7em);pointer-events:none;filter:drop-shadow(0 0 .3em #ffd76a80)}
.card.miss .lgb{filter:grayscale(1) brightness(.5)}

.fbox{position:absolute;inset:0;transform-style:preserve-3d;color:#2a1a10;filter:drop-shadow(0 .5em .8em #000a)}
.fimg{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(.5em);pointer-events:none}
.fart{position:absolute;overflow:hidden;border-radius:.3em;transform:translateZ(.2em)}
.fart .aimg,.fart svg{width:100%;height:100%;object-fit:cover;display:block}
.r2 .fart::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,#ff6bd5 32%,#6bf3ff 44%,#fffb6b 56%,#7dff8a 68%,transparent 80%);background-size:260% 260%;background-position:var(--mx) var(--my);mix-blend-mode:color-dodge;opacity:.16;pointer-events:none}
.ft{position:absolute;display:flex;align-items:center;transform:translateZ(1em)}
.fhd{justify-content:space-between;padding:0 .3em}
.fnm{font:.58em/1 'MRDisplay',sans-serif;display:flex;align-items:center;gap:.25em;white-space:nowrap;min-width:0;overflow:hidden;flex:1}.fnm .n{overflow:hidden;text-overflow:ellipsis}
.fnm .stg{font-size:.38em;margin:0}
.fhp{flex:none;font:.6em/1 'MRDisplay',sans-serif;color:#b8251a;display:flex;align-items:center;gap:.18em;white-space:nowrap}
.fhp small{font:700 .4em Rubik,sans-serif;color:#2a1a10}
.fhp .ti{width:1em;height:1em}
.frb{justify-content:center;font-size:.28em;font-style:italic;white-space:nowrap;overflow:hidden}
.fpn{flex-direction:column;align-items:stretch;justify-content:center;gap:.24em;padding:0 .5em}
.fak{width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:.2em}
.fak .en{width:.5em;height:.5em}
.fakn{font-size:.44em;font-weight:700;line-height:1.1}
.fakd{font:.6em/1 'MRDisplay',sans-serif}
.fakt{grid-column:1/-1;font-size:.27em;line-height:1.3;opacity:.85;margin-top:.15em}
.fwr{width:100%;display:flex;justify-content:space-between;font-size:.26em;font-weight:700;border-top:.1em solid #0002;padding-top:.6em;white-space:nowrap}
.fwr span{display:flex;align-items:center;gap:.3em}.fwr .en{width:1.4em;height:1.4em}
.fflv{font-size:.25em;font-style:italic;line-height:1.35;opacity:.75}
.fbt{justify-content:space-between;padding:0 .6em;font-size:.26em;font-weight:700}
.fbt .sym{font-size:1.5em}
.fcard .shine{border-radius:.5em}
.fcard .new{transform:translateZ(1.6em)}
.fcard.miss .fart .aimg{filter:grayscale(1) brightness(.3) contrast(1.3)}
.fcard.miss .fimg{filter:grayscale(.85) brightness(.55)}
.fcard.miss .ft{color:#5d544c}.fcard.miss .fhp{color:#5d544c}

/* ================= AI SİMGELERİ ================= */
.en,.ti{background:none!important;box-shadow:none!important}
.en img,.ti img,.eic{width:100%;height:100%;display:block;filter:none!important}
.card.miss .en,.card.miss .ti,.card.miss .si,.card.miss .hpi,.card.miss .fxi,.card.miss .ssym{filter:grayscale(1) brightness(.7)}
.chip img{width:20px;height:20px}.legend img{width:22px;height:22px}
.si{height:1.7em;width:auto;vertical-align:middle;margin-right:.15em}
.hpi{height:.8em;width:auto;margin-right:.1em;vertical-align:-.08em}
.fxi{height:1.35em;width:auto;vertical-align:middle;margin-right:.3em}
.ssym{height:1.1em;width:auto;vertical-align:middle}
.pi{width:22px;height:22px;object-fit:contain}
.lvpill{padding:2px 8px 2px 4px}
.lvpill.hasav{padding:2px;cursor:pointer}.lvpill.hasav .lvw{width:36px;height:36px}.lvpill.hasav #lvimg{border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-sizing:border-box;box-shadow:0 2px 6px #0008}
.lvpill.hasav .lvw b{inset:auto -6px -5px auto;width:19px;height:19px;border-radius:50%;background:#2a1650;border:1.5px solid var(--gold);font-size:10px}
.avw{position:relative;width:38px;height:38px;flex:none}
.avw.on::before{content:'';position:absolute;left:-1px;top:-1px;width:11px;height:11px;border-radius:50%;background:#3ddc5a;box-shadow:0 0 0 2px #140a2a;z-index:1}
.onl{color:#5be37a;font-style:normal;font-weight:700;margin-right:6px}.ofl{color:#9aa6b2;font-style:normal;margin-right:6px}
.chat{display:flex;flex-direction:column;gap:8px}
.chl{height:min(48vh,380px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:12px;background:#0006;overscroll-behavior:contain}
.chm{display:flex;gap:7px;align-items:flex-end;max-width:88%}.chm.me{align-self:flex-end;flex-direction:row-reverse}
.chav{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;border:1.5px solid #ffffff44}
.chb{background:#ffffff14;border-radius:12px 12px 12px 4px;padding:6px 10px;display:flex;flex-direction:column;min-width:0}
.chm.me .chb{background:#f5c45133;border-radius:12px 12px 4px 12px}
.chb b{font:700 12px Rubik,sans-serif;color:var(--gold);cursor:pointer}.cht{font:14px/1.35 Rubik,sans-serif;color:#fff;word-break:break-word;white-space:pre-wrap}
.cht em{color:#9aa6b2}.chb small{font:10.5px Rubik,sans-serif;color:#9aa6b2;align-self:flex-end}.chb small a{color:#ff8a7a;cursor:pointer}
.chi{display:flex;gap:6px}.chi .btn{flex:none;width:auto;margin:0;padding:10px 14px}
.frdm{position:relative;font-size:15px}.frdm i{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;border-radius:9px;background:#ff4d4d;color:#fff;font:700 10px/17px Rubik,sans-serif;font-style:normal;padding:0 4px}
.b2auto{margin:6px auto 0;display:block;border:1px solid #ffffff33;background:#0008;color:#c9d3dc;border-radius:99px;padding:6px 14px;font:700 12.5px Rubik,sans-serif}
.b2auto{display:flex;align-items:center;gap:6px}.b2auto img{width:24px;height:24px;margin:-4px 0 -4px -6px}.b2auto.on{background:#3ddc5a33;border-color:#3ddc5a;color:#9ff0b0}.b2idle{text-align:center;color:#ffcf6b;font:700 12.5px Rubik,sans-serif;margin-top:4px}
.onc{margin:0;font:600 13px Rubik,sans-serif;color:#c9d3dc}.onc b{color:#3ddc5a}.avw .avm{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #ffffff44;box-sizing:border-box}
.avw .avlg{position:absolute;right:-5px;bottom:-4px;width:20px;height:20px;object-fit:contain;filter:drop-shadow(0 1px 2px #000)}
[data-prof]{cursor:pointer}

  fire:  {weak:['water','earth'], res:['fire'],  imm:[]},
  water: {weak:['earth','air','poison'],   res:['water'], imm:[]},
  earth: {weak:['air','light','metal'],   res:['earth'], imm:[]},
  air:   {weak:['fire','shadow','poison'], res:['air'],   imm:['earth']},
  light: {weak:['shadow','fire','metal'], res:['light'], imm:[]},
  shadow:{weak:['light','water'], res:['shadow'],imm:[]},
  metal: {weak:['fire','water'], res:['metal'], imm:['poison']},   // Seri 2
  poison:{weak:['earth','light'], res:['poison'], imm:[]},         // Seri 2
  blood: {weak:[], res:['blood'], imm:[]}   // Kan: sadece Ezeli kartlar, hiçbir türe karşı zayıf değil
};
const weaksOf=t=>TYPES[t].weak, ressOf=t=>TYPES[t].res, immsOf=t=>TYPES[t].imm;
const weakOf=t=>TYPES[t].weak[0], resOf=t=>TYPES[t].res[0];
const strongVs=t=>ELS.filter(d=>TYPES[d].weak.includes(t));
// saldıran türün savunan türe etkisi: 'w' ×2, 'r' −20, 'i' bağışık, '' normal
const rel=(atk,def)=>TYPES[def].imm.includes(atk)?'i':TYPES[def].weak.includes(atk)?'w':TYPES[def].res.includes(atk)?'r':'';
const WEAK=1.5;   // zayıflık çarpanı
function applyRel(d,atk,def){const k=rel(atk,def);return k==='i'?0:k==='w'?round5(d*WEAK):k==='r'?Math.max(10,d-20):d}

let curT=null,noTilt=false;
function resetT(c){for(const[k,v]of[['--rx','0deg'],['--ry','0deg'],['--mx','50%'],['--my','30%']])c.style.setProperty(k,v)}
document.addEventListener('pointermove',e=>{
  if(noTilt)return;
  const c=e.target.closest&&e.target.closest('.tiltable');
  if(curT&&curT!==c)resetT(curT);curT=c;if(!c)return;
  const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height,m=c.classList.contains('big')?28:16;
  c.style.setProperty('--ry',((px-.5)*m).toFixed(1)+'deg');c.style.setProperty('--rx',((.5-py)*m).toFixed(1)+'deg');
  c.style.setProperty('--mx',(px*100|0)+'%');c.style.setProperty('--my',(py*100|0)+'%');
},{passive:true});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{if(curT){resetT(curT);curT=null}}));

async function flyGems(xi){
  const src=$('#tear').getBoundingClientRect(),dst=$('#lvb').getBoundingClientRect();
  const n=Math.max(6,Math.min(26,Math.round(xi.gain/2))),per=xi.gain/n;
  let lvl=xi.from.lvl,xp=xi.from.xp,acc=0;const lvb=$('#lvb'),xpf=$('#xpf'),xpt=$('#xpt');
  const jobs=[];
  for(let k=0;k<n;k++){
    const g=document.createElement('i');g.className='gem';document.body.appendChild(g);
    const sx=src.left+src.width*(.25+Math.random()*.5),sy=src.top+src.height*.1;
    const bx=sx+(Math.random()-.5)*140,by=sy-40-Math.random()*90;
    const ex=dst.left+dst.width/2-8,ey=dst.top+dst.height/2-8;
    const a=g.animate([{transform:`translate(${sx}px,${sy}px) scale(.3)`,opacity:0},{transform:`translate(${bx}px,${by}px) scale(1)`,opacity:1,offset:.35},{transform:`translate(${ex}px,${ey}px) scale(.6)`,opacity:1}],{duration:900+Math.random()*300,delay:k*45,easing:'cubic-bezier(.4,0,.6,1)',fill:'forwards'});

      while(xp>=XP.need(lvl)){xp-=XP.need(lvl);lvl++;SFX.level();lvb.textContent=lvl;lvb.classList.remove('pop');void lvb.offsetWidth;lvb.classList.add('pop');toast(`Seviye ${lvl}! +${XP.reward.free} ücretsiz paket, +${XP.reward.gold} altın`)}
      xpf.style.width=xp/XP.need(lvl)*100+'%';xpt.textContent=`${xp}/${XP.need(lvl)}`;}).catch(()=>g.remove()));
  }
  await Promise.all(jobs);

  if(label){const rc=el.getBoundingClientRect(),t=document.createElement('div');t.className='bchip';t.style.setProperty('--rc',AUC[type]);t.innerHTML=`${icon(type)}<b>${label}</b>`;
    t.style.left=rc.left+rc.width/2+'px';t.style.top=rc.top+rc.height*.45+'px';document.body.appendChild(t);setTimeout(()=>t.remove(),1300)}
  for(let k=0;k<6;k++){const p=document.createElement('i');p.className='bspk';p.style.background=AUC[type];el.appendChild(p);
    p.animate([{transform:`translate(${20+Math.random()*60}%,90%) scale(1)`,opacity:1},{transform:`translate(${20+Math.random()*60}%,${-10-Math.random()*30}%) scale(.3)`,opacity:0}],{duration:900+Math.random()*400,delay:Math.random()*200,fill:'forwards'}).finished.then(()=>p.remove()).catch(()=>p.remove())}
},delay)}
const AULBL={poison:v=>`${v} zehir`,earth:v=>`−${v} kalkan`,water:v=>`+${v} can`,fire:v=>`+${v} hasar`,light:()=>'arınma',shadow:v=>`+${v} zayıflatma`};
const auraKeys=bd=>{const a=auras(bd),o={};['earth','water','fire','shadow','poison'].forEach(k=>{if(a[k])o[k]=a[k]});if(a.light>=0)o.light=a.light+1;return o};
// yeni gelen ya da güçlenen destekleri o taraftaki bütün kartlarda göster
function announceAuras(side,prev={}){const now=auraKeys(B[side].board),a=auras(B[side].board);let d=0;
  Object.keys(now).forEach(k=>{if((prev[k]||0)>=now[k])return;B[side].board.forEach((f,i)=>{if(f)ringFx(elOf(side,i),k,i===1||!B[side].board[1]?AULBL[k](a[k]):'',d)});d+=450})}
function exEnter(s,i){if(!B)return;const f=B[s].board[i];if(!f||!f.c.ex||f.entered)return;f.entered=1;const o=s==='me'?'foe':'me',el=elOf(s,i);
  setTimeout(()=>{if(!B)return;if(f.c.exa==='blast'){ringFx(el,f.c.el,(f.c.ez?'EZELİ: ':'EX: ')+f.c.name);B[o].board.forEach((t,k)=>{if(!t)return;const dd=f.c.ez?40:50;t.hp=Math.max(1,t.hp-dd);const te=elOf(o,k);bnum(te,'−'+dd,'w')});SFX.hit(f.c.el,'w')}
   if(f.c.exa==='heal'){ringFx(el,'light','EX: '+f.c.name);B[s].board.forEach((t,k)=>{if(!t)return;const hh=f.c.ez?50:70;t.hp=Math.min(mx(t),t.hp+hh);clearBad(t);ringFx(elOf(s,k),'water','+'+hh+' can',150)});SFX.heal()}
   if(f.c.exa==='stand')ringFx(el,'shadow','EX: '+f.c.name);

   setTimeout(()=>{if(B&&!B.over&&!B.busy)renderBattle()},900)},300)}
async function sweep(){
  if(!B||B.over)return true;
  const dead=[];['foe','me'].forEach(s=>B[s].board.forEach((f,i)=>{if(f&&f.hp<=0)dead.push([s,i,f])}));
  if(!dead.length)return false;
  {const nf=dead.filter(([s])=>s==='foe').length;if(nf)dq('ko',null,nf)}SFX.ko();dead.forEach(([s,i])=>{const e=elOf(s,i);if(e)e.classList.add('kod')});
  await wait(650);if(!B||B.over)return true;
  const pk={me:auraKeys(B.me.board),foe:auraKeys(B.foe.board)};
  // Ölüağaç: Ruh Hasadı (sahadaki her Ölüağaç, yenilen her kart için güçlenir; kendisi yenilince bir kez son düşen kartını geri getirir)
  const hv=[];B.lastKO=B.lastKO||{};
  ['me','foe'].forEach(s=>B[s].board.forEach((h,hi)=>{if(!h||h.hp<=0||h.c.exa!=='harvest')return;const n=dead.length;if(!n)return;h.max=mx(h)+40*n;h.hp+=40*n;
    [hi-1,hi+1].forEach(j=>{const g=B[s].board[j];if(g&&g.hp>0){g.max=mx(g)+20*n;g.hp+=20*n}});hv.push([s,hi,n])}));
  const rev=[];
  dead.forEach(([s,i,f])=>{const n=koN(f);B[s].lives=Math.max(0,B[s].lives-n);B[s].board[i]=null;
    if(f.c.exa==='harvest'&&!f.revd&&B.lastKO[s]&&B[s].lives>0){const c=B.lastKO[s],g=mk(c);g.hp=Math.max(10,Math.round(mx(g)/2/5)*5);g.revd=1;B[s].board[i]=g;rev.push([s,i,c])}
    if(!f.c.ez)B.lastKO[s]=f.c});
  B.log=dead.map(([s,i,f])=>`<b>${f.c.name}</b> yenildi · ${s==='me'?'sen':'rakip'} ${koN(f)} can kaybetti${f.ko2?' (Feda: tek vuruş!)':''}`).join('<br>');
  if(hv.length)B.log+='<br>'+hv.map(([s,i,n])=>`<b>Ruh Hasadı</b>: Ölüağaç +${40*n} can`).join('<br>');if(rev.length)B.log+='<br>'+rev.map(([s,i,c])=>`<b>Ölüağaç</b> son ruhu geri çağırdı: <b>${c.name}</b> sahada!`).join('<br>');
  renderBattle();hv.forEach(([s,i,n])=>{ringFx(elOf(s,i),'shadow','Ruh Hasadı +'+40*n)});rev.forEach(([s,i])=>ringFx(elOf(s,i),'light','Geri döndü!'));
  dead.forEach(([s])=>{const hs=document.querySelectorAll(`[data-lv="${s}"] img`),h=hs[B[s].lives];if(h)h.animate([{transform:'scale(2)',filter:'none'},{transform:'scale(.8)'}],{duration:550})});
  setTimeout(()=>{if(!B)return;announceAuras('me',pk.me);announceAuras('foe',pk.foe)},350);
  const fl=outOf(B,'foe'),ml=outOf(B,'me');
  if(fl||ml){const win=fl&&!ml?true:fl&&ml?B.turn==='me':false;
    B.why=win?(B.foe.lives<=0?'Rakibin 6 canının hepsini aldın':'Rakibin savaşacak yaratığı kalmadı'):(B.me.lives<=0?'Rakip 6 canının hepsini aldı':'Savaşacak yaratığın kalmadı');
    await wait(500);endBattle(win);return true}
  await wait(350);return false;
}
// tur başı: dolma + yanık hasarı
async function beginTurn(s){
  const ev=coreTurn(B,s);B.justCharged=ev.charged;renderBattle();
  if(ev.frz&&ev.frz.length){const o=s==='me'?'foe':'me';ev.frz.forEach(k=>ringFx(elOf(o,k),'water','Donduruldu!'));SFX.hit('water','w');await wait(500)}
  if(!ev.cleanse.length&&!ev.dot.length&&!ev.heal.length&&!ev.drain.length&&!ev.spread.length)return false;
  if(ev.drain.length){await wait(250);const o=s==='me'?'foe':'me';for(const[i,hit,got]of ev.drain){ringFx(elOf(s,i),'shadow','Can çekti +'+got);hit.forEach(k=>{const e=elOf(o,k);bnum(e,'−'+EZDR,'w');if(e)e.classList.add('hit')});SFX.hit('shadow','w');await wait(650)}}
  await wait(300);
  ev.cleanse.forEach(i=>{const e=elOf(s,i);bfx(e,'light',1.2,800);ringFx(e,'light','Arındı')});
  if(ev.cleanse.length)await wait(500);
  ev.dot.forEach(([i,d])=>{const e=elOf(s,i);bfx(e,'fire',1.1,800);bnum(e,'−'+d+' etki','');if(e)e.classList.add('hit')});
  if(ev.dot.length)await wait(600);
  ev.spread.forEach(i=>ringFx(elOf(s,i),'poison','Zehir bulaştı'));
  ev.heal.forEach(([i,v])=>{const e=elOf(s,i);bfx(e,'heal',1.1,800);ringFx(e,'water','+'+v+' can')});
  if(ev.heal.length||ev.spread.length)await wait(600);
  return await sweep();
}

async function strike(s,ai,ti){

  if(ev.amp)setTimeout(()=>ringFx(elOf(o,ti),'shadow','Kötü etkiler ×'+ev.amp),500);

  ev.spread.forEach(i=>setTimeout(()=>ringFx(elOf(o,i),'poison','Zehir bulaştı'),700));

  if(at.fx==='burn'&&!d.burn&&dmg<d.hp)sc+=FXV.burn*1.5;
  if(at.fx==='heal')sc+=Math.min(FXV.heal,mx(a)-a.hp)*.8;

function simulate(n){
  const res={plain:[],smart:[],evo1:[]},CAP=4000;
  const chains=CARDS.filter(c=>c.stage>0);
  for(let k=0;k<n;k++){
    for(const smart of[false,true]){
      const cnt={};let p=0,pity=0,dust=0,have=0,firstEvo=0;
      const add=id=>{if(!cnt[id]){cnt[id]=0;have++}cnt[id]++};
      while(have<N&&p<CAP){p++;const r=rollPack(pity);pity=r.pity;r.out.forEach(c=>add(c.id));
        let did=true;while(did){did=false;
          for(const t of chains){if(cnt[t.id])continue;const root=rootOf(t),need=EVO_NEED[t.stage];
            if((cnt[root.id]||0)-1>=need&&(t.stage<2||cnt[t.from])){cnt[root.id]-=need;add(t.id);did=true;if(!firstEvo)firstEvo=p}}}
        if(smart){
          // zinciri tamamlanmış ya da evrimi olmayan kartların fazlası toza
          for(const c of CARDS){const x=cnt[c.id]||0;if(x<2)continue;const needMore=c.stage===0&&chains.some(t=>rootOf(t).id===c.id&&!cnt[t.id]);
            if(!needMore){dust+=(x-1)*RAR[c.r].dust;cnt[c.id]=1}}
          for(const c of CARDS){if(cnt[c.id]||c.stage>0)continue;if(dust>=RAR[c.r].craft){dust-=RAR[c.r].craft;add(c.id)}}
        }
      }
      (smart?res.smart:res.plain).push(p);if(!smart)res.evo1.push(firstEvo||p);
    }
  }
  const st=a=>{a.sort((x,y)=>x-y);return{avg:Math.round(a.reduce((s,x)=>s+x,0)/a.length),med:a[a.length>>1],p90:a[Math.floor(a.length*.9)]}};
  return{no:st(res.plain),cr:st(res.smart),e1:st(res.evo1)};
}

// Kod biçimi: "MR1." + JSON kaydının base64 hali. Başka cihaza / adrese ilerleme taşımak için.
const SAVE_PFX='MR1.';
function saveCode(){const j=JSON.stringify(S);return SAVE_PFX+btoa(unescape(encodeURIComponent(j)))}
function parseSaveCode(txt){
  txt=(txt||'').trim().replace(/\s+/g,'');
  if(!txt.startsWith(SAVE_PFX))throw new Error('Bu bir Mythbeast kayıt kodu değil.');
  let d;try{d=JSON.parse(decodeURIComponent(escape(atob(txt.slice(SAVE_PFX.length)))))}catch(e){throw new Error('Kod bozuk ya da eksik kopyalanmış.')}
  if(!d||typeof d!=='object'||!d.owned||typeof d.owned!=='object')throw new Error('Kodun içinde kart koleksiyonu yok.');
  return d}

  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(v).then(()=>true,()=>fb());
  return Promise.resolve(fb())}

/* ---------- ÖĞRETİCİ ---------- */
// adımlar: 1 karşılama · 2 paket açma (3 paket, her birinden 2 Kıvılcık) · 5 evrim · 6 arena · 8 bitti · 9 eski oyuncu
function initTut(){if(S.tut!=null)return;if(!Object.keys(S.owned||{}).length&&!S.opened){S.tut=1;S.tp=0;S.th=0;S.owned={[TUT.card]:TUT.start};save()}else S.tut=9}
initTut();
const tutOn=()=>S.tut>0&&S.tut<8;
function showWelcome(){const ov=$('#ov'),c=BY[TUT.card];ov.className='ov on';
  ov.innerHTML=`<div class="ovt">Mythbeast Realm'e hoş geldin!</div><div class="twel">${cardHTML(c,{full:1,w:'min(48vw,200px)'})}<div class="tnum">×${TUT.start}</div></div>
  <p class="ttx">Yolculuğuna başlaman için sana <b>${TUT.start} ${c.name}</b> verdim. Aynı karttan yeterince toplayınca onu <b>evrimleştirebilirsin</b>.<br>Sana <b>${ECON.freePacks} ücretsiz paket</b> hediye ettim. Önce ${TUT.packs} tanesini açalım, belki içinden daha fazla ${c.name} çıkar!</p>
  <div class="ovb"><button class="btn" id="tgo2">Hadi başlayalım</button></div>`;
  $('#tgo2').onclick=()=>{S.tut=2;save();ov.className='ov';ov.innerHTML='';tab='pack';render()}}
// paket hilesi: öğreticinin ilk paketlerinde 2 Yaygın yuvaya Kıvılcık koy
// hedef seçimi: o anki duruma göre neyi göstereceğini bulur
function tutTarget(){
  if(!tutOn()||$('#title'))return null;const ov=$('#ov'),on=ov.classList.contains('on'),q=x=>document.querySelector(x),nm=BY[TUT.card].name;
  if(S.tut===1)return null;
  if(S.tut<5){if(on){if(ov.classList.contains('scene'))return null;if(q('#more'))return['#more',`Güzel! ${TUT.packs-(S.tp||0)} paket daha var`];return null}
    if(tab!=='pack')return['nav button[data-tab=pack]','Paketlere git'];return['#buy',`${S.free||TUT.packs-(S.tp||0)} ücretsiz paketin var. Aç bakalım!`]}
  if(S.tut===5){if(on){if(q('#done'))return['#done',`${owned(TUT.card)} ${nm} topladın! Evrim için yeterli. Koleksiyona gidelim`];
      const eb=q(`.evbtn[data-t="${TUT.evo}"]`);if(eb)return[`.evbtn[data-t="${TUT.evo}"]`,`10 ${nm} birleşip ${BY[TUT.evo].name} olacak. Evrimleştir!`];if(q('.evstage'))return null;if(q('#close'))return['#close','Kapat'];return null}
    if(tab!=='col')return['nav button[data-tab=col]','Koleksiyona git'];return[`.grid .card[data-id="${TUT.card}"]`,`${nm} kartına dokun`]}
  if(S.tut===6){if(on){if(q('#close'))return['#close',`Tebrikler, ${BY[TUT.evo].name} artık senin! Evrimli kartlar çok daha güçlü. Kapat ve arenaya gidelim`];return null}
    if(!B){if(tab!=='arena')return['nav button[data-tab=arena]','Arenaya git'];return['#fight','Desten hazır. Savaşa gir!']}
    if(B.over||B.turn!=='me'||B.busy||!B.t0)return null;
    if(B.tut&&B.tstep===0){const j=B.me.hand.findIndex(x=>x.t==='c'),i=B.me.board.findIndex(f=>!f);
      if(j>=0&&i>=0)return[`.hk[data-h="${j}"]`,'Bunlar elindeki kartlar. Sahada boş bir yer var: bu yaratığa dokun, sahaya çıksın'];B.tstep=1}
    if(B.tut&&B.tstep===1){const j=B.me.hand.findIndex(x=>x.t==='s'&&x.k==='evo'),i=B.me.board.findIndex(f=>f&&canSup('evo',f,true)===true);
      if(j>=0&&i>=0&&!B.supUsed){if(B.selH===null)return[`.hk[data-h="${j}"]`,'Bu bir destek kartı: Evrim Taşı. Dokun ve seç'];
        return[`.bk[data-s="me"][data-i="${i}"]`,`Şimdi ${B.me.board[i].c.name} kartına dokun. Yenilene kadar evrimleşmiş savaşır!`]}B.tstep=2}
    if((S.th||0)>=3)return null;
    if(B.sel===null){const i=B.me.board.findIndex(f=>f);return i<0?null:[`.bk[data-s="me"][data-i="${i}"]`,(S.th||0)?'Sıra yine sende. Saldıracak yaratığını seç':'Şimdi saldırma zamanı! Saldıracak yaratığına dokun']}
    const j=B.foe.board.findIndex(f=>f);return j<0?null:[`.bk[data-s="foe"][data-i="${j}"]`,'Rakip bir karta dokun. Üstündeki sayı vereceğin hasar; yeşilse zayıf noktasını buldun']}
  return null}
let tutSel=null;
function tutTick(){const t=tutTarget(),cb=$('#coach'),cr=$('#cring');
  const el=t&&document.querySelector(t[0]);
  if(!t||!el||!el.offsetParent&&el.tagName!=='BUTTON'){cb.classList.remove('on');cr.classList.remove('on');tutSel=null;return}
  if(tutSel!==t[0]){tutSel=t[0];const r0=el.getBoundingClientRect();if(r0.top<60||r0.bottom>innerHeight-90)el.scrollIntoView({block:'center',behavior:'smooth'})}
  const r=el.getBoundingClientRect(),pad=6;
  cr.style.cssText=`left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px`;cr.classList.add('on');
  cb.querySelector('span').textContent=t[1];cb.classList.add('on');
  const bh=cb.offsetHeight,below=r.bottom+14+bh<innerHeight-8;
  const bw=Math.min(innerWidth-24,320);let x=Math.max(12,Math.min(innerWidth-bw-12,r.left+r.width/2-bw/2));
  cb.style.width=bw+'px';cb.style.left=x+'px';cb.style.top=(below?r.bottom+14:Math.max(8,r.top-14-bh))+'px';
  cb.classList.toggle('up',!below);cb.style.setProperty('--ax',Math.max(18,Math.min(bw-18,r.left+r.width/2-x))+'px')}
setInterval(tutTick,200);
// savaş içi ipucu (doldurma), bir kez
function tutHit(){if(S.tut!==6)return;S.th=(S.th||0)+1;save();
  if(S.th===1)setTimeout(()=>tipBox('Saldırı turunu bitirir, sonra sıra rakibe geçer. Rakibin yaratığını yenince yukarıdaki <b>kalplerinden biri</b> söner. 6 kalbi söndüren kazanır!'),2600);
  if(S.th===2)setTimeout(()=>tipBox('İpucu: Bir tur saldırmayan kart <b>dolar</b> (çerçevesi parlar). Dolu kartın sonraki vuruşu güçlü ikinci saldırısıdır. Kartlarını sırayla kullan!'),1200)}
function tipBox(h){const d=document.createElement('div');d.className='tipbox';d.innerHTML=`<span>${h}</span><button>Anladım</button>`;document.body.appendChild(d);d.querySelector('button').onclick=()=>d.remove();setTimeout(()=>d.remove(),12000)}
const sndIco=()=>SFX.on()?'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
{const ts=$('#tsnd');ts.innerHTML=sndIco();ts.onclick=e=>{e.stopPropagation();SFX.toggle();ts.innerHTML=sndIco()}}
{const t=$('#title');$('#tinfo').textContent=`Seviye ${S.lvl} · ${uniq()}/${N} kart`;
 $('#tgo').onclick=()=>{setTimeout(()=>{musGo=true;musicSync()},2500);t.classList.add('out');setTimeout(()=>t.remove(),600);if(S.tut===1&&(window.claude||accGet().tok))setTimeout(showWelcome,350)}}
render();
connectDb();
cloudInit();
}
</script>
</body>
</html>
